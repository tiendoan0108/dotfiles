set -g prefix ^B

### ── General Options ────────────────────────────────────────────────
set -g mouse on

# Terminal / true color support
set -g default-terminal "tmux-256color"
set -as terminal-features ",ghostty:RGB"
set -ag terminal-overrides ",*256col*:Tc"

set -g base-index 1
set -g pane-base-index 1
set -g mode-keys vi
set-option -g status-position bottom

bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# Sesh configs
bind-key "T" run-shell "sesh connect \"$(
  sesh list --icons | fzf-tmux -p 80%,70% \
    --no-sort --ansi --border-label ' sesh ' --prompt '⚡  ' \
    --header '  ^a all ^t tmux ^g configs ^x zoxide ^d tmux kill ^f find' \
    --bind 'tab:down,btab:up' \
    --bind 'ctrl-a:change-prompt(⚡  )+reload(sesh list --icons)' \
    --bind 'ctrl-t:change-prompt(🪟  )+reload(sesh list -t --icons)' \
    --bind 'ctrl-g:change-prompt(⚙️  )+reload(sesh list -c --icons)' \
    --bind 'ctrl-x:change-prompt(📁  )+reload(sesh list -z --icons)' \
    --bind 'ctrl-f:change-prompt(🔎  )+reload(fd -H -d 2 -t d -E .Trash . ~)' \
    --bind 'ctrl-d:execute(tmux kill-session -t {2..})+change-prompt(⚡  )+reload(sesh list --icons)' \
    --preview-window 'right:55%' \
    --preview 'sesh preview {}'
)\""

### ── Plugin Manager (TPM) ───────────────────────────────────────────
# TPM must be listed first
set -g @plugin 'tmux-plugins/tpm'

# Sensible defaults
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'jaclu/tmux-menus'
set -g @plugin 'tmux-plugins/tmux-resurrect'

# Catppuccin theme — pinned to v2 (v0.3.x config syntax has been removed)
set -g @plugin 'catppuccin/tmux#v2.3.0'
set -g @catppuccin_flavor 'frappe'

# Window styling (v2 syntax — "_fill" options were removed in v2)
set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_window_number_color "#{@thm_surface_1}"
set -g @catppuccin_window_text " #W (#{b:pane_current_path})"
set -g @catppuccin_window_current_number_color "#{@thm_peach}"
set -g @catppuccin_window_current_text " #W"

# Make the status line pretty and add some modules
set -g status-right-length 100
set -g status-left-length 100
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_application}"
set -ag status-right "#{E:@catppuccin_status_session}"
set -ag status-right "#{E:@catppuccin_status_uptime}"

## ── TPM Initialization (MUST be last) ─────────────────────────────
run '~/.tmux/plugins/tpm/tpm'
